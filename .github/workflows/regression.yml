name: GrensCalc regressietests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer herleidingsmatrix 2026
        run: node payroll/nl-2026-herleiding.test.mjs
      - name: Controleer jaarlijkse heffingskortingen 2026
        run: node payroll/nl-2026-annual-credits.test.mjs
      - name: Controleer Nederlandse rekenvoorschriften 2026 basisformule
        run: node payroll/nl-2026-rekenvoorschriften-basic.test.mjs
      - name: Vergelijk rekenformule met geïmporteerde tijdvaktabel
        run: node payroll/compare-formula-table.test.mjs
      - name: Controleer Nederlandse tabeladapter
        run: node payroll/nl-2026-table-engine.test.mjs
      - name: Controleer herimport met bestaand importbewijs
        run: node payroll/verify-import-manifest.test.mjs
      - name: Controleer SHA-256 importbewijs en metadata
        run: node payroll/import-manifest.test.mjs
      - name: Controleer CSV-import loonbelastingtabellen
        run: node payroll/import-nl-2026-csv.test.mjs
      - name: Controleer referentiecases in browsermodule
        run: node payroll/compare-cases-browser.test.mjs
      - name: Controleer onafhankelijke validatie-fail-closed
        run: node payroll/verify-official-2026.test.mjs
      - name: Controleer overdracht van profiel naar loonheffing
        run: node tests/payroll-handoff.test.mjs
      - name: Controleer veilige loon-scenariodeellinks
        run: node payroll/share-scenario.test.mjs
      - name: Controleer batchberekening en CSV-export
        run: node payroll/batch-calculator.test.mjs
      - name: Controleer compleet tabeloverzicht en CSV-export
        run: node payroll/table-inventory.test.mjs
      - name: Controleer vergelijking van twee nettoloonscenario's
        run: node payroll/scenario-comparison.test.mjs
      - name: Controleer bruto-netto op basis van ingeladen tabel
        run: node payroll/net-from-table.test.mjs
      - name: Controleer tabelbereik en grenswaarden
        run: node payroll/table-diagnostics.test.mjs
      - name: Controleer exacte officiële voorbeeldopzoekingen
        run: node payroll/exact-official-samples.test.mjs
      - name: Controleer officiële NL 2026 referentiebedragen
        run: node payroll/official-nl-2026-samples.test.mjs
      - name: Controleer echte ESM-imports en exports van payrollmodules
        run: node tests/payroll-module-integrity.test.mjs
      - name: Controleer payrollpagina
        run: node tests/payroll-page.test.mjs
      - name: Controleer ingebouwde calculatorregressies
        run: node tests/calculator-regression.test.mjs
