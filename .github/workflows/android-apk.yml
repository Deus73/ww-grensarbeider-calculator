name: Build GrensCalc Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrensCalc-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare APK for public download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk GrensCalc.apk
      - name: Publish downloadable APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: GrensCalc Android APK (online webapp)
          prerelease: true
          make_latest: false
          files: GrensCalc.apk
          overwrite_files: true
          body: |
            Android WebView-app die altijd de online GrensCalc-webapp opent.
            Dit is een debug-ondertekende APK, niet een Play Store-release.
